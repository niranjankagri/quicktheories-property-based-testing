# Property-based tests on every push and pull request (1,000 generated examples per property), plus a weekly deep run
# with 20,000 per property to look further for rare failures. The job summary shows the test totals and the
# shrinking demos (buggy first drafts and the smallest failing example found for each).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '40 23 * * 5'   # Friday 23:40 UTC: deep run
  workflow_dispatch:
    inputs:
      examples:
        description: Generated examples per property
        default: '20000'

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  properties:
    name: Property-based tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Deep run on the schedule and on manual runs; the normal 1,000 otherwise
      EXAMPLES: ${{ github.event_name == 'schedule' && '20000' || inputs.examples || '1000' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Tests (${{ env.EXAMPLES }} examples per property)
        run: ./mvnw -B test -Dqt.examples="$EXAMPLES" | tee maven.log

      - name: Summary
        if: always()
        run: |
          {
            echo "### Property-based tests ($EXAMPLES examples per property)"
            echo
            grep -E "Tests run: [0-9]+, Failures" maven.log | tail -1 | sed 's/^\[[A-Z]*\] //' || true
            # A falsified property prints its smallest failing example and the seed to reproduce it
            if grep -q "Property falsified" maven.log; then
              echo
              echo '```'
              grep -A6 "Property falsified" maven.log | head -60
              echo '```'
            fi
            echo
            cat target/shrinking-report.md 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/shrinking-report.md
          if-no-files-found: ignore
