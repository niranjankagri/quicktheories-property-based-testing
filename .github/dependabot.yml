# Keeps dependencies and CI actions current (security alerts are on separately). Once a month, minor and patch
# updates are grouped into one pull request per ecosystem; a major version comes as its own pull request and is
# reviewed before merging. QuickTheories has had no release since 0.26 (2019), so updates will mostly be TestNG,
# AssertJ, the Maven plugins and the actions.
version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: monthly
    groups:
      maven-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github-actions-minor-patch:
        update-types: [minor, patch]
